<!DOCTYPE html>
<html>
<head>
<title>The Social Gate</title>
<meta charset="UTF-8">
<link rel='stylesheet' type='text/css' href='social.css'>
</head>
<body>

<div class='topbar'>
 <img src="favicon.ico" class="topbarlogo"/>
</div>

<div class="page">
 <div class="gate">
  <div class="gatecol">
   <h2>Log in</h2>
   <form method="post" enctype="multipart/form-data" action="doLogin.html">
    <input type="text" name="name" placeholder="Username" autocomplete="username" required>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
   </form>
  </div>
  <div class="gatecol">
   <h2>Sign up</h2>
   <form method="post" enctype="multipart/form-data" action="doSignup.html">
    <input type="text" name="name" placeholder="Username" autocomplete="username" required>
    <input type="password" name="password" placeholder="Password" autocomplete="new-password" required>
    <button type="submit">Create account</button>
   </form>
  </div>
 </div>
 <div class="gateworld"><img src="world.png"></div>
</div>

</body>
</html>
